apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: releases-test-staging-2
  finalizers:
    - resources-finalizer.argocd.argoproj.io/foreground
spec:
  project: default
  destination:
    name: in-cluster
    namespace: akav-namespace-staging-2
  sources:
    - path: guestbook-stg-2
      repoURL: https://github.com/akavalchuk/argocd-example-apps.git
      targetRevision: HEAD
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
      allowEmpty: false
    syncOptions:
      - PrunePropagationPolicy=foreground
      - Replace=false
      - PruneLast=false
      - Validate=true
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=false
      - ServerSideApply=true
      - RespectIgnoreDifferences=false
